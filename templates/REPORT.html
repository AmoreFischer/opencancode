<!DOCTYPE html>
<html lang="zh-CN" data-dark>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告标题（改我）</title>
<!-- ============================================================
  报告模板 v1.1（2026-09-15 定稿，替代 v1.0；v1.0 备份见同目录）
  规格（铁律「报告输出规范」v1.1）：
    ① 响应式三态：≥1100 桌面（侧栏导航+正文）· 760-1100 两栏（侧栏入抽屉）
      · <760 手机单栏文档流（100dvh / text-size-adjust / 表格代码块横滚 / 44px 回顶+安全区）
    ② TOC 自动生成 + 滚动高亮 + 平滑跳转；≤1100 变高亮「☰ 目录」抽屉（四路关闭）
    ③ 暗色默认（html[data-dark]）+ 右上角主题切换（localStorage 记忆）
    ④ 右下角回顶按钮（滚动出现，手机 44px + 安全区）
    ⑤ 单文件零依赖（内嵌 CSS/JS，可离线打开）
    ⑥ 滚动条：主滚动区隐藏（位置感=顶部进度条+回顶）；
       侧栏/代码块/表格 8px 圆角细条
    ⑦ 动画/交互语言 [溯源: @deepseek-ai/dsh WebUI（npm 公开包）]：
       section 入场 opacity+translateX(4px)（IntersectionObserver+跳读兜底）·
       滚动容器上下 mask 24px 渐隐 · 100/200/300ms + cubic-bezier(.4,0,.2,1) ·
       prefers-reduced-motion 降级
    ⑧ 阅读范式：连续文档全展开；
       移动端元信息=「ℹ️ 报告信息」折叠条（原生 details）
  设计 token：bluish 灰阶 + 深蓝主色 [溯源: @deepseek-ai/dsh WebUI 主题（npm 公开包）]
  用法：复制本文件 → 改 <title> 与 header h1 → 侧栏「报告信息」→ 正文 <section>
    （h2/h3 自动进 TOC；章节入场动画自动生效；表格自动包横滚层）
  长章节可选折叠：给 section 加 data-fold 属性 + 首 <p class="preview"> 摘要，
    JS 会自动构建折叠头（预览 clamp 两行，点击平滑展开）——本模板默认全展开
============================================================ -->
<style>
  :root{
    --bg:#f9fafb; --l1:#ffffff; --l2:#f1f3f5;
    --t1:#0f1115; --t2:#61666b; --t3:#81858c;
    --bd:rgba(0,0,0,.06); --bd2:rgba(0,0,0,.10);
    --code:#f9fafb;
    --brand:#4176e6; --brand-soft:rgba(65,118,230,.10);
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --shadow-panel:0 0 0 .5px var(--bd),0 3px 8px rgba(0,0,0,.03),0 0 16px rgba(0,0,0,.02);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  html[data-dark]{
    --bg:#151517; --l1:#232324; --l2:#2c2c2e;
    --t1:#f9fafb; --t2:#cfd3d6; --t3:#adb2b8;
    --bd:rgba(255,255,255,.06); --bd2:rgba(255,255,255,.12);
    --code:#1b1b1c;
    --brand:#5686fe; --brand-soft:rgba(86,134,254,.14);
    --ok:#4ed17e; --warn:#f7ad31; --bad:#f87171;
    --shadow-panel:0 0 0 .5px var(--bd2),0 3px 8px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--t1);font:14.5px/1.85 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  code,pre{font-family:"SF Mono","JetBrains Mono","Fira Code",Consolas,Menlo,monospace}
  /* ⑥ 滚动条：主区隐藏，局部 8px 圆角细条 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--t3);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  #side,#doc,#doc pre,.tw{scrollbar-width:none}
  #side::-webkit-scrollbar,#doc::-webkit-scrollbar,#doc pre::-webkit-scrollbar,.tw::-webkit-scrollbar{display:none}

  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--l1);border-bottom:.5px solid var(--bd2);flex-shrink:0;position:relative;z-index:50}
  header h1{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{background:transparent;border:1px solid var(--bd2);color:var(--t2);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;transition:background .1s var(--ease),color .1s var(--ease);font-family:inherit}
  .btn:hover{background:var(--l2);color:var(--t1)}
  #tocBtn{display:none;align-items:center;gap:6px;background:var(--brand-soft);border:1px solid var(--brand);color:var(--brand);font-weight:600;flex-shrink:0}
  #progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--brand);transition:width .12s linear;pointer-events:none}

  main{display:flex;flex:1;min-height:0}
  #side{width:264px;flex-shrink:0;background:var(--l1);border-right:.5px solid var(--bd2);overflow-y:auto;display:flex;flex-direction:column}
  .side-cap{font-size:12px;color:var(--t3);padding:14px 12px 6px;letter-spacing:.5px}
  #toc a{display:block;color:var(--t2);text-decoration:none;font-size:13px;line-height:20px;padding:6px 12px;border-radius:8px;margin:0 6px 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .1s var(--ease)}
  #toc a:hover{background:var(--l2);color:var(--t1)}
  #toc a.lvl3{padding-left:26px;font-size:12.5px;color:var(--t3)}
  #toc a.active{background:var(--l2);color:var(--brand);font-weight:600}

  /* ⑦ 主区：mask 上下渐隐 + 隐藏滚动条 */
  #doc{
    flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;
    -webkit-mask-image:linear-gradient(#0000 0,#000 24px calc(100% - 24px),#0000 100%);
    mask-image:linear-gradient(#0000 0,#000 24px calc(100% - 24px),#0000 100%);
  }
  .col{max-width:860px;margin:0 auto;padding:26px 44px 90px}
  /* ⑦ 章节入场动画 */
  #doc section{margin-bottom:46px;opacity:0;transform:translateX(4px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
  #doc section.in{opacity:1;transform:none}

  #doc h2{font-size:19px;line-height:28px;font-weight:700;padding-bottom:10px;border-bottom:.5px solid var(--bd2);margin-bottom:16px;scroll-margin-top:20px}
  #doc h2 .no{color:var(--brand);margin-right:8px;font-size:15px}
  #doc h3{font-size:15.5px;line-height:24px;font-weight:600;margin:18px 0 8px;scroll-margin-top:20px}
  #doc h3::before{content:"";display:inline-block;width:3px;height:13px;background:var(--brand);border-radius:2px;margin-right:8px;vertical-align:-2px}
  #doc p{margin-bottom:10px}
  #doc b{font-weight:600}
  #doc code{background:var(--l2);border-radius:5px;padding:1.5px 6px;font-size:13px}
  #doc pre{background:var(--code);border:.5px solid var(--bd);border-radius:10px;padding:13px 15px;overflow-x:auto;margin-bottom:10px;font-size:13px;line-height:1.6}
  #doc pre code{background:none;padding:0}
  .tw{overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  #doc table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.6}
  #doc th,#doc td{border-bottom:.5px solid var(--bd2);padding:8px 12px;text-align:left;vertical-align:top}
  #doc th{background:var(--l2);font-weight:600;color:var(--t2);font-size:12.5px}
  #doc tr:hover td{background:var(--l2)}
  #doc blockquote{border-left:3px solid var(--brand);background:var(--brand-soft);padding:9px 15px;border-radius:6px 12px 12px 6px;margin-bottom:10px;color:var(--t2)}
  #doc ul{padding-left:22px;margin-bottom:10px}
  #doc li{margin-bottom:4px}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}

  #backTop{position:fixed;right:24px;bottom:24px;width:40px;height:40px;border-radius:12px;background:var(--l1);box-shadow:var(--shadow-panel);border:none;color:var(--t2);font-size:17px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:60}
  #backTop.show{opacity:1;pointer-events:auto}
  #backTop:hover{color:var(--brand)}
  #tocBackdrop{display:none}
  .m-meta{display:none}

  /* ① 断点 */
  @media (max-width:1100px){
    #side{display:none}
    #tocBtn{display:inline-flex}
  }
  @media (max-width:760px){
    body{height:auto;overflow:visible;display:block}
    header{position:sticky;top:0}
    main{display:block}
    #doc{overflow:visible}
    .col{padding:16px 14px 70px}
    #doc h2{font-size:18px;scroll-margin-top:60px}
    #doc h3{scroll-margin-top:60px}
    #side{display:flex;position:fixed;top:0;left:0;bottom:0;width:min(80vw,300px);transform:translateX(-105%);transition:transform .25s var(--ease);z-index:70;box-shadow:10px 0 30px rgba(0,0,0,.30);border-right:none}
    body.toc-open #side{transform:translateX(0)}
    #tocBackdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:65}
    body.toc-open #tocBackdrop{opacity:1;pointer-events:auto}
    #backTop{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px}
    /* ⑧ 移动端元信息：折叠 ℹ️ 条（桌面此块隐藏，元信息在侧栏） */
    .m-meta{display:block;background:var(--l1);border:.5px solid var(--bd2);border-radius:12px;box-shadow:var(--shadow-panel);padding:13px 16px;margin-bottom:16px;font-size:13px}
    .m-meta summary{cursor:pointer;list-style:none;user-select:none;display:flex;align-items:center;justify-content:space-between;color:var(--t1);font-weight:600;font-size:13.5px}
    .m-meta summary::-webkit-details-marker{display:none}
    .m-meta summary .chev{color:var(--t3);font-size:11px;transition:transform .2s var(--ease)}
    .m-meta[open] summary .chev{transform:rotate(90deg)}
    .m-meta .meta-body{margin-top:6px;border-top:.5px solid var(--bd)}
    .m-meta .meta-row{padding:9px 0;border-bottom:.5px solid var(--bd)}
    .m-meta .meta-row:last-child{border-bottom:none}
    .m-meta .meta-row .k{font-size:12px;color:var(--t3);margin-bottom:2px}
    .m-meta .meta-row .v{font-size:12.5px;color:var(--t2);line-height:1.7}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    #doc section{opacity:1;transform:none}
  }
</style>
</head>
<body>

<header>
  <button id="tocBtn" class="btn">☰ 目录</button>
  <h1>📄 报告标题（改我）</h1>
  <button id="themeToggle" class="btn">🌙 / ☀️</button>
  <i id="progress"></i>
</header>

<main>
  <!-- 侧栏：报告导航 + 报告信息（改我） -->
  <aside id="side">
    <div class="side-cap">报告导航</div>
    <nav id="toc"></nav>
    <div class="side-cap" style="border-top:.5px solid var(--bd2);margin-top:8px">报告信息</div>
    <div style="padding:4px 18px 16px;font-size:12px;color:var(--t3);line-height:1.7">
      日期 · 执行平台/模型 · 搜索链/花费<br>状态：<span class="ok">✅ 完成</span>
    </div>
  </aside>

  <div id="doc">
    <div class="col">

      <!-- 移动端折叠元信息（改我；桌面隐藏） -->
      <details class="m-meta">
        <summary><span>ℹ️ 报告信息</span><span class="chev">▶</span></summary>
        <div class="meta-body">
          <div class="meta-row"><div class="k">日期</div><div class="v">YYYY-MM-DD</div></div>
          <div class="meta-row"><div class="k">执行</div><div class="v">平台 · 模型</div></div>
          <div class="meta-row"><div class="k">对象</div><div class="v">报告对象/范围</div></div>
          <div class="meta-row"><div class="k">状态</div><div class="v"><span class="ok">✅ 完成</span></div></div>
        </div>
      </details>

      <!-- 正文：section 的 h2/h3 自动进 TOC；表格自动包横滚层（改我） -->
      <section>
        <h2><span class="no">〇</span>TL;DR 速览</h2>
        <p>报告最核心结论放这里，读的人 10 秒拿到。</p>
        <div class="tw"><table>
          <tr><th>项</th><th>结论</th></tr>
          <tr><td>示例行</td><td><span class="ok">状态色</span> / <span class="warn">警示色</span> / <span class="bad">风险色</span></td></tr>
        </table></div>
      </section>

      <section>
        <h2><span class="no">一</span>示例章节（删我，按实际结构组织）</h2>
        <p>正文段落。支持 <code>行内代码</code>、<b>加粗</b>、引用块：</p>
        <blockquote>重要声明或局限说明放引用块。</blockquote>
        <h3>1.1 小节（自动进 TOC 三级）</h3>
        <pre><code>代码块示例（自动横滚）
command --here</code></pre>
      </section>

    </div>
  </div>
</main>

<div id="tocBackdrop"></div>
<button id="backTop" title="回到顶部">↑</button>

<script>
(function(){
  /* 主题切换（localStorage 记忆，默认暗色） */
  var root=document.documentElement,btn=document.getElementById('themeToggle');
  try{if(localStorage.getItem('report-theme')==='light')root.removeAttribute('data-dark');
      else root.setAttribute('data-dark','');}catch(e){root.setAttribute('data-dark','')}
  btn.onclick=function(){
    var dark=root.hasAttribute('data-dark');
    if(dark)root.removeAttribute('data-dark');else root.setAttribute('data-dark','');
    try{localStorage.setItem('report-theme',dark?'light':'dark');}catch(e){}
  };
  /* 表格自动包横滚层 */
  document.querySelectorAll('#doc table').forEach(function(t){
    var w=document.createElement('div');w.className='tw';
    t.parentNode.insertBefore(w,t);w.appendChild(t);});
  /* TOC 自动生成 */
  var toc=document.getElementById('toc'),centers=document.querySelectorAll('#doc h2,#doc h3');
  centers.forEach(function(h,i){h.id=h.id||('sec-'+i);
    var a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;
    a.className=h.tagName==='H2'?'lvl2':'lvl3';a.setAttribute('data-for',h.id);
    a.addEventListener('click',function(ev){ev.preventDefault();
      var t=document.getElementById(h.id);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
      document.body.classList.remove('toc-open');});
    toc.appendChild(a);});
  /* scrollspy + 回顶 + 进度条（双模式：桌面=doc 滚动，≤1100=整页滚动） */
  var mq=window.matchMedia('(max-width:1100px)');
  var doc=document.getElementById('doc'),back=document.getElementById('backTop'),links=toc.querySelectorAll('a');
  var prog=document.getElementById('progress');
  function rootEl(){return mq.matches?document.scrollingElement:doc;}
  function onScroll(){
    var el=rootEl(),max=el.scrollHeight-el.clientHeight;
    prog.style.width=(max>0?(el.scrollTop/max*100):0)+'%';
    back.classList.toggle('show',el.scrollTop>300);
    var cur=null;centers.forEach(function(h){if(h.getBoundingClientRect().top<120)cur=h.id;});
    links.forEach(function(a){a.classList.toggle('active',a.getAttribute('data-for')===cur);});
  }
  doc.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('scroll',onScroll,{passive:true});
  back.onclick=function(){rootEl().scrollTo({top:0,behavior:'smooth'});};
  /* section 入场动画 + 跳读兜底 */
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
  },{threshold:.06,rootMargin:'0px 0px -5% 0px'});
  var secs=[].slice.call(document.querySelectorAll('#doc section'));
  secs.forEach(function(el){io.observe(el);});
  var vh=function(){return window.innerHeight||document.documentElement.clientHeight;};
  secs.forEach(function(el){if(el.getBoundingClientRect().top<vh())el.classList.add('in');});
  window.addEventListener('scroll',function(){
    secs.forEach(function(el){
      if(!el.classList.contains('in')&&el.getBoundingClientRect().top<vh()){
        el.style.transition='none';el.classList.add('in');
      }
    });
  },{passive:true});
  /* 抽屉（≤1100） */
  var tocBtn=document.getElementById('tocBtn'),bd=document.getElementById('tocBackdrop');
  function closeToc(){document.body.classList.remove('toc-open');}
  tocBtn.onclick=function(){document.body.classList.toggle('toc-open');};
  bd.onclick=closeToc;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeToc();});
})();
</script>
</body>
</html>
