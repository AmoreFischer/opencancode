<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报告模板 · Report Template</title>
<!-- ============================================================
  报告模板 v1.0（2026-09-15 规范化）
  规格（铁律「报告输出规范」）：
    ① 三栏布局：左=元信息/概览，中=正文（两侧拖条可调宽），右=导航目录
    ② 右侧导航：TOC 自动生成 + 滚动高亮 + 点击跳转
    ③ 默认暗色主题，右上角切换按钮（localStorage 记忆）
    ④ 右下角回顶按钮（滚动出现）
    ⑤ 单文件零依赖（内嵌 CSS/JS，可离线打开）
  [溯源: 可拖分栏交互参考通用 IDE/Web GUI 惯例；规范固化 2026-09-15]
  用法：复制本文件 → 改 <title> 与左栏元信息 → 正文区写 <section>（h2/h3 自动进 TOC）
============================================================ -->
<style>
  :root{
    --bg:#0f1117; --bg-panel:#161a23; --bg-card:#1c212d; --border:#2a3040;
    --text:#d7dce6; --text-dim:#8b93a5; --accent:#5b9dff; --accent-soft:rgba(91,157,255,.12);
    --ok:#4ade80; --warn:#facc15; --bad:#f87171; --dragbar:#2a3040;
  }
  [data-theme="light"]{
    --bg:#f5f6f8; --bg-panel:#ffffff; --bg-card:#eef0f4; --border:#d5d9e2;
    --text:#24292f; --text-dim:#5a6272; --accent:#0b62d6; --accent-soft:rgba(11,98,214,.08);
    --ok:#15803d; --warn:#a16207; --bad:#b91c1c; --dragbar:#c9cedb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.75 "Segoe UI","Microsoft YaHei",sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  /* ── 顶栏 ── */
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0}
  header h1{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #themeToggle{background:var(--bg-card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
  #themeToggle:hover{border-color:var(--accent)}
  /* ── 三栏 ── */
  main{display:flex;flex:1;min-height:0}
  #leftPanel{width:240px;min-width:160px;max-width:420px;overflow-y:auto;background:var(--bg-panel);border-right:1px solid var(--border);padding:16px;flex-shrink:0}
  #centerPanel{flex:1;min-width:280px;overflow-y:auto;padding:28px 40px;scroll-behavior:smooth}
  #rightPanel{width:230px;min-width:150px;max-width:380px;overflow-y:auto;background:var(--bg-panel);border-left:1px solid var(--border);padding:14px;flex-shrink:0}
  .dragbar{width:5px;cursor:col-resize;background:var(--dragbar);flex-shrink:0;transition:background .15s}
  .dragbar:hover,.dragbar.active{background:var(--accent)}
  /* ── 左栏 ── */
  .meta-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px}
  .meta-card .k{color:var(--text-dim);font-size:12px}
  .meta-card .v{font-weight:600;margin-bottom:8px}
  /* ── 正文 ── */
  #centerPanel section{margin-bottom:38px}
  #centerPanel h2{font-size:20px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:16px;scroll-margin-top:20px}
  #centerPanel h3{font-size:16px;margin:20px 0 10px;color:var(--accent);scroll-margin-top:20px}
  #centerPanel p{margin-bottom:10px}
  #centerPanel code{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px}
  #centerPanel pre{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin-bottom:12px}
  #centerPanel pre code{background:none;border:none;padding:0}
  #centerPanel table{border-collapse:collapse;width:100%;margin-bottom:12px;font-size:13.5px}
  #centerPanel th,#centerPanel td{border:1px solid var(--border);padding:7px 10px;text-align:left}
  #centerPanel th{background:var(--bg-card)}
  #centerPanel blockquote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 14px;border-radius:0 8px 8px 0;margin-bottom:12px;color:var(--text-dim)}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  /* ── 右栏 TOC ── */
  #tocTitle{font-size:12px;color:var(--text-dim);letter-spacing:2px;margin-bottom:10px}
  #toc a{display:block;color:var(--text-dim);text-decoration:none;font-size:13px;padding:5px 10px;border-left:2px solid transparent;border-radius:0 6px 6px 0;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toc a:hover{color:var(--text);background:var(--bg-card)}
  #toc a.lvl2{font-weight:600}
  #toc a.lvl3{padding-left:22px;font-size:12.5px}
  #toc a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
  /* ── 回顶 ── */
  #backTop{position:fixed;right:26px;bottom:26px;width:40px;height:40px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
  #backTop.show{opacity:1;pointer-events:auto}
  #backTop:hover{border-color:var(--accent);color:var(--accent)}
  /* ── 响应式 ── */
  @media (max-width:900px){#leftPanel,#leftPanel+.dragbar{display:none}#rightPanel{width:170px}}
  @media (max-width:600px){#rightPanel,#rightPanel+.dragbar{display:none}}
</style>
</head>
<body>

<header>
  <h1>📄 报告标题（改我）</h1>
  <button id="themeToggle" title="切换主题">🌙 / ☀️</button>
</header>

<main>
  <!-- 左栏：报告元信息（改我） -->
  <aside id="leftPanel">
    <div class="meta-card">
      <div class="k">日期</div><div class="v">2026-09-15</div>
      <div class="k">执行</div><div class="v">&lt;平台&gt; · &lt;模型（推理档位）&gt;</div>
      <div class="k">对象</div><div class="v">（写审了什么/做了什么）</div>
      <div class="k">状态</div><div class="v"><span class="ok">✅ 通过</span> / <span class="warn">🟡 建议修</span> / <span class="bad">🔴 必须修</span></div>
    </div>
    <div class="meta-card">
      <div class="k">一句话结论</div>
      <div class="v" style="font-weight:400">（报告 TLDR 放这里，读报告的人 10 秒拿到结论）</div>
    </div>
  </aside>

  <div class="dragbar" data-target="leftPanel"></div>

  <!-- 中栏：正文（section 的 h2/h3 自动进 TOC） -->
  <div id="centerPanel">
    <section>
      <h2>一、示例章节</h2>
      <p>正文段落。支持 <code>行内代码</code>、<span class="ok">状态色</span>、表格与代码块：</p>
      <blockquote>引用块用于重要声明或结论前置。</blockquote>
      <pre><code># 代码块示例
command --here</code></pre>
      <h3>1.1 小节</h3>
      <p>小节标题自动进入右侧导航第三级。</p>
    </section>
    <section>
      <h2>二、第二个章节</h2>
      <p>删掉示例，按报告实际结构组织。</p>
    </section>
  </div>

  <div class="dragbar" data-target="rightPanel"></div>

  <!-- 右栏：导航（自动生成） -->
  <aside id="rightPanel">
    <div id="tocTitle">导航 · CONTENTS</div>
    <nav id="toc"></nav>
  </aside>
</main>

<button id="backTop" title="回到顶部">↑</button>

<script>
(function(){
  /* 主题切换（localStorage 记忆，默认暗色） */
  var root=document.documentElement,btn=document.getElementById('themeToggle');
  var saved=localStorage.getItem('report-theme'); if(saved)root.setAttribute('data-theme',saved);
  btn.onclick=function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next); localStorage.setItem('report-theme',next);
  };
  /* TOC 自动生成 */
  var toc=document.getElementById('toc'),centers=document.querySelectorAll('#centerPanel h2,#centerPanel h3');
  centers.forEach(function(h,i){h.id=h.id||('sec-'+i);
    var a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;
    a.className=h.tagName==='H2'?'lvl2':'lvl3';a.setAttribute('data-for',h.id);toc.appendChild(a);});
  /* 滚动高亮（scrollspy）+ 回顶按钮显隐 */
  var cp=document.getElementById('centerPanel'),back=document.getElementById('backTop'),links=toc.querySelectorAll('a');
  cp.addEventListener('scroll',function(){
    back.classList.toggle('show',cp.scrollTop>300);
    var cur=null;centers.forEach(function(h){if(h.offsetTop-80<=cp.scrollTop)cur=h.id;});
    links.forEach(function(a){a.classList.toggle('active',a.getAttribute('data-for')===cur);});
  },{passive:true});
  back.onclick=function(){cp.scrollTo({top:0,behavior:'smooth'});};
  /* 拖条：调整相邻栏宽（触屏兼容） */
  document.querySelectorAll('.dragbar').forEach(function(bar){
    var side=bar.getAttribute('data-target'),panel=document.getElementById(side), startX=0, startW=0;
    function down(x){bar.classList.add('active');startX=x;startW=panel.offsetWidth;
      document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
      document.addEventListener('touchmove',tmove);document.addEventListener('touchend',up);}
    function move(e){var d=(side==='rightPanel'?startX-e.clientX:e.clientX-startX);
      panel.style.width=Math.min(Math.max(startW+d,150),side==='rightPanel'?380:420)+'px';}
    function tmove(e){move(e);e.preventDefault();}
    function up(){bar.classList.remove('active');
      document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
      document.removeEventListener('touchmove',tmove);document.removeEventListener('touchend',up);}
    bar.addEventListener('mousedown',function(e){down(e.clientX);e.preventDefault();});
    bar.addEventListener('touchstart',function(e){down(e.touches[0].clientX);},{passive:false});
  });
})();
</script>
</body>
</html>
